<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TI-30 · Punkt vor Strich</title>
  <meta name="description" content="TI-30 (1976) simulation: how a calculator understands the order of operations – step by step.">
  <meta name="theme-color" content="#1c1109">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="app.title"></h1>
      <p data-i18n="app.subtitle"></p>
    </div>
    <div class="settings">
      <button type="button" class="pill" id="btn-lang">EN</button>
      <label class="pill toggle" data-i18n-title="settings.early.title"><input type="checkbox" id="opt-early"> <span data-i18n="settings.early"></span></label>

      <div class="status" id="status" aria-live="polite"></div>

    <section class="panel" id="panel" aria-live="off"></section>
